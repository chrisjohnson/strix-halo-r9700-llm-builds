name: docker
services:
  kat-coder-v2.5-dev-mtp-q6--llamacpp-vulkan-radv-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: kat-coder-v2.5-dev-mtp-q6--llamacpp-vulkan-radv-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/llamacpp-kat-coder-v2.5-dev-mtp-q6:/models:ro
    command: 'llama-server -m /models/Kwaipilot_KAT-Coder-V2.5-Dev-MTP-UD-Q6_K.gguf
      -dev Vulkan1 -ngl 999 -fa 1 --spec-type draft-mtp,ngram-mod --spec-draft-n-max
      1 --spec-draft-n-min 0 --spec-draft-p-min 0.75 --spec-ngram-mod-n-min 8 --spec-ngram-mod-n-max
      24 --spec-ngram-mod-n-match 48 -np 1 -c 131072 -n 8192 -ctk q8_0 -ctv q8_0 --host
      0.0.0.0 --port 8080 -a kat-coder-v2.5-dev-mtp-q6 --metrics

      '
    ports:
    - 127.0.0.1:8112:8080
