  notes: >-
    M-139 (2026-09-02). Chris asked whether the standing Dirk/Ornith builds
    handle images - they didn't: v3's GGUF is text-only (confirmed via
    header metadata - no clip/vision keys), not because Qwen/Qwen3.8-27B
    lacks vision (it's natively a vision-language model, per its own model
    card - native image/video understanding), but because whatever pulled
    the GGUF never fetched the separate mmproj file llama.cpp needs
    alongside the main quant for VL models. Confirmed the deployed
    llama-server binary has full mtmd/vision support compiled in
    (--mmproj, --mmproj-device, llama-mtmd-cli all present) before doing
    any of this.

    peculiar-ragdoll/Dirk-Qwen3.8-27B-GGUF - the exact same repo v1-v3's
    GGUF already comes from - publishes mmproj-F16.gguf (928 MB)
    alongside the text quants (confirmed via HF tree listing). This is
    the standard llama.cpp VL mechanism (main GGUF + separate mmproj
    GGUF via --mmproj), not a graft or a rebuild - same quant file as
    v3, only addition is the projector + --mmproj-device Vulkan0 (pin to
    the same GPU as the main model, avoid a silent CPU fallback).

    Declared via a new configuration.nix download-service entry
    (dirk-qwen3.8-27b-mmproj, separate directory) rather than editing the
    v1-v3 model directory's existing entry - download-model-<name>
    services key their idempotency off a per-directory .download-complete
    marker, so editing the original entry in place wouldn't have re-
    triggered anything (same reasoning as M-051's separate imatrix
    re-download entry).

    Real verification (2026-09-02, after mmproj download completed):
    brought up via `modelctl up ... --exclusive` (GPU-scoped, stopped v3
    first). /props confirms modalities.vision: true at the server level.
    Sent a real multimodal chat completion (base64 PNG, a red square
    with a blue circle) via /v1/chat/completions - response: "A blue
    circle is centered inside a red square on a white background." -
    exactly correct, not a hallucination or generic answer. Genuinely
    working, not just loaded-without-error.

    cache-ram/context/MTP flags unchanged from v3 - adding a vision
    projector doesn't touch text-generation throughput, same reasoning
    already confirmed for v3's own cache-ram/mlock changes against v2;
    not separately re-benchmarked for throughput.
