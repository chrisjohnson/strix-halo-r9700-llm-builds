name: docker
services:
  qwen3.6-27b--llamacpp-vulkan-radv-server-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: qwen3.6-27b--llamacpp-vulkan-radv-server-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/ollama-qwen3.6-27b:/models:ro
    command: 'llama-server -m /models/Qwen3.6-27B-Q4_K_M.gguf -dev Vulkan1 -ngl 999
      -fa 1 -lm none -cb -kvu --host 0.0.0.0 --port 8080 -np 4 -c 32768 --metrics

      '
    ports:
    - 127.0.0.1:8100:8080
