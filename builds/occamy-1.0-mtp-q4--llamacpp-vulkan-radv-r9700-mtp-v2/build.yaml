name: occamy-1.0-mtp-q4--llamacpp-vulkan-radv-r9700-mtp-v2
status: TESTED_VIABLE
derived:
  engine: llamacpp-vulkan-radv-v1
  model: Occamy-1.0 (Q4_K_M, MTP, vision)
  params: 35B
  active_params: 3B
  quant: Q4_K_M
  mtp: true
  dflash: false
  target_gpu: r9700-egpu-dock
  notes: >-
    2026-09-27. RECOMMENDED R9700 BUILD. Same model, quant and flags as
    ...-r9700-mtp-v1 with exactly one variable changed: `-ctk q4_0 -ctv q4_0`
    instead of `-ctk q8_0 -ctv q8_0`.

    RESULT - the KV quant is worth far more than the memory saving suggests:

      metric                  v1 (q8_0)   v2 (q4_0)   delta
      prefill  8k (9,354 tok)      1261        2190   +73.7%
      prefill 32k (35,255 tok)     1080        1641   +51.9%
      decode   ctx 0                 78          87   +11%  (noisy, see below)
      decode   ctx 16,384            95          80   -16%  (noisy, see below)

    VRAM: v1 used 30.87 GiB of 31.86 plus 3.42 GiB of host GTT. v2 uses 28.99 GiB plus
    1.55 GiB of GTT - total demand down ~3.75 GiB, matching the predicted q8_0 -> q4_0
    saving of ~3.76 GiB (3 slots x 262144, 10 of 40 layers full-attention, kv_heads=2,
    head_dim=256) almost exactly. The prefill gain is the PCIe spill coming off the KV
    cache, which is touched on every token.

    CONTROL, because the first v2 run was taken with flash-next stopped and could have
    been an environment effect rather than a KV effect: v2 prefill is 2190 alone and 2189
    with flash-next resident (32k: 1641 vs 1630). flash-next's presence does not move
    occamy's prefill, so the +74%/+52% is the KV quant. Decode, by contrast, is noisy
    run-to-run - the two v2 runs disagree in both directions (c0k 79 vs 87, c16k 103 vs
    80) - so treat prefill as the measured result and decode as needing repeats.

    SLOT SWEEP - np 3 is the largest that fits, and the remaining spill is cheap. The
    whole point of --kv-unified here is total KV capacity, so the question is how many
    262144-token slots fit. Measured by starting a throwaway instance per np and reading
    card0's counters once healthy (VRAM saturates at 31.86 GiB; anything beyond it is host
    GTT over PCIe):

      np   vram GiB   gtt GiB   total demand
       1      23.79      0.54           24.33
       2      26.39      1.04           27.43
       3      28.99      1.55           30.54   <- fits
       4      30.59      3.05           33.64   <- overcommits
       5      31.82      4.95           36.77
       6      31.46      8.44           39.90

    np 1-3 grow ~3.1 GiB per slot; np 4 is where VRAM saturates and the spill jumps. Given
    that v1's 3.42 GiB spill cost 74% of prefill throughput, np 4 (3.05 GiB) is expected to
    be in that bad regime, and np 5-6 certainly are.

    But the last gigabyte of spill is worth almost nothing, which is why np 3 stays: np 1
    measured 2208/1636 tok/s against np 3's 2189/1630 - +0.9% / +0.4%, i.e. noise - while
    np 3 carries three times the slot count. Removing spill is only worth doing down to
    about 1.5 GiB; below that it buys nothing measurable. So np 3 + q4_0 KV is the
    recommendation, not np 1.

    STILL UNTESTED: `--cache-ram` sizing (32768 here). It is host RAM, so it does not
    compete for occamy's VRAM - but on this box it does compete with flash-next's page
    cache, which is separate and unmeasured.

    OPERATIONAL WARNING learned while creating this build: the Vulkan backend does NOT
    fail when VRAM is exhausted, it silently allocates into host GTT. With v1 still
    running and card0 full, this build came up reading vram_used 0.99 GiB and gtt_used
    29.55 GiB - almost the whole model over PCIe - and still answered /health 200. Always
    check card0's vram_used/gtt_used after bringing one of these up, and never bring two
    R9700 builds up at once.

    Also learned: modelctl --exclusive reads a build's own build.yaml derived.target_gpu.
    This build initially had only a docker-compose.yaml, so exclusivity could not resolve
    its GPU and stopped the wrong build (flash-next on the APU) instead of the intended
    R9700 one, while leaving v1 in place. The build.yaml now exists; do not create R9700
    builds without it.

    REPRODUCING THIS: the image is EXTERNAL and public - `docker pull
    docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv`. Nothing is built. Weights are one
    file, /var/lib/ai-models/llamacpp-occamy-1.0-mtp-q4/occamy-1.0-mtp-Q4_K_M.gguf, plus
    /var/lib/ai-models/occamy-1.0-mmproj for vision; both declared in local-ai-machine's
    configuration.nix models list. Full walkthrough, including the number to expect and the
    memory split with the APU build: docs/reproducing-the-pair.md.

    THIS IS THE ROLE medium-moe POINTS AT (2026-09-28), and it is the better-configured half of
    the pair: it runs --cache-ram 32768 where the APU build leaves llama.cpp's 8192 MiB default,
    and q4_0 KV where the APU build runs f16. Both of those were measured here - q4_0 KV was
    worth +73.7% prefill at 8k and +51.9% at 32k against q8_0 - which is why
    knowledge/research/2026-09-28-flashnext-agentic-tuning-levers.md treats the APU build as the
    one that is behind, and these as the settings to try there.


    REPRODUCING THIS BUILD - everything needed, none of it implicit:
    PULL IT - external public image, nothing is built here:
            docker pull docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
          Engine: llama.cpp compiled for Vulkan RADV on gfx1151.
    WEIGHTS: /var/lib/ai-models/llamacpp-occamy-1.0-mtp-q4/occamy-1.0-mtp-Q4_K_M.gguf
            (one file) plus /var/lib/ai-models/occamy-1.0-mmproj for vision. Declared in
            local-ai-machine's configuration.nix models list.
    RUN IT: sudo ./modelctl up --exclusive <this build id>. This is the R9700 (Vulkan)
            build: card0, and ROCm's device numbering is the OPPOSITE of Vulkan's.
    Engine internals and what each upstream commit does: knowledge/research/2026-09-27-strix-halo-engine-landscape.md