name: qwen3.8-flash-next-iq4xs--llamacpp-rocm100-halobox-lazy-direct-fit-strixhalo-mtp-v1
status: TESTED_NOT_VIABLE
derived:
  engine: llamacpp-rocm100-halobox-lazy-direct-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: UD-IQ4_XS
  mtp: true
  dflash: false
  target_gpu: strix-apu
  vision: true
  notes: >-
    M-166. Sibling of ...-ub8192-nocacheram-strixhalo-mtp-v1 - one variable
    changed: `-fit off -ngl all -c 262144 -b 8192 -ub 8192` replaced with
    `-fit on -fitt 12288 -fitc 4096 -fitp on` and ngl/c/b/ub left UNSET so
    llama-server's own fit-params mechanism sizes them against real device
    memory at startup, instead of our hand-picked values. No new download -
    reuses the exact same GGUF/mmproj/MTP files already on the box.

    MOTIVATION: split out of Chris's "start from scratch on these flags" audit
    (M-160). Both existing builds run `-fit off`, and since every memory flag
    is already pinned explicitly, that's currently a near no-op. Worth
    checking whether `--fit`'s automatic sizing is actually a better-informed
    starting point than our own static assumptions, which have been proven
    wrong twice in one day already (both M-160 nocacheram fixes came from
    margin math baked in at build time no longer matching reality once the
    engine's real footprint changed).

    SOURCE-LEVEL FINDING (read common/fit.cpp and common/fit.h directly, not
    guessed, before building this): `common_fit_params()`'s own header
    comment states it "fits mparams and cparams to free device memory
    (assumes system memory is unlimited)" and only modifies parameters that
    are still at their llama_default_model_params value (n_gpu_layers,
    tensor_split, tensor_buft_overrides) plus n_ctx when it equals 0 (unset).
    There is no reference to cache_ram anywhere in fit.cpp - `--cache-ram` is
    a tools/server-level host-RAM pool entirely outside the
    llama_model_params/llama_context_params structs `--fit` operates on.

    CONCLUSION BEFORE ANY BENCHMARK: `--fit` categorically cannot size or cap
    `--cache-ram`, and explicitly assumes system RAM is unlimited - it is a
    per-device (GPU) memory-sizing tool. Both of M-160's real OOM incidents
    this session were host-RAM exhaustion from `--cache-ram` pools growing
    against stale margin assumptions, a problem class `--fit` is not designed
    to address and would not have prevented either way. This build still
    exists to answer the narrower, legitimate remaining question: does `--fit`
    pick a sane, safe `-ngl`/`-c`/`-b`/`-ub` at startup on this specific
    unified-memory APU (where "device" memory for ROCm IS system RAM, not a
    fixed discrete VRAM pool), well enough to be a lower-maintenance default
    than hand-tuning for the flags it CAN reach?

    `-fitt 12288`: target margin picked to roughly match what hand-tuning
    already banks for this box's other residents (occamy on the other GPU,
    DSH/app containers) rather than fit's own 1024 MiB default, which assumes
    nothing else on the box needs memory.

    VALIDATED (2026-10-07). One real packaging gap found along the way:
    `-fitp on` (`--fit-print`, meant to log fit's exact chosen values) is NOT
    accepted by this box's pinned llama-server build - "error: invalid
    argument: -fitp", confirmed via a live crash-loop before being dropped
    from the command. Fit's actual choices were read from the ordinary
    startup log instead.

    WHAT FIT CHOSE: a second real limitation surfaced immediately at boot -
    `failed to measure the memory of the extra model, fitting without it:
    failed to create llama_context from model` (the MTP draft model is an
    "extra model" in fit's own terminology; its own test-context failed with
    `qwen4exp requires ctx_other to be set`). Fit silently fell back to sizing
    the main model alone, NOT accounting for the draft model's real memory
    footprint during its own calculation - a real gap in fit's
    speculative-decode-aware path for this specific model family. Despite
    that fallback, the model, mmproj, and MTP draft model all loaded and ran
    correctly (confirmed via a real "pong" completion), and fit landed on
    `n_ctx_slot = 262144` - identical to our hand-picked `-c 262144`. 28-31
    GiB available after boot/soak - a healthy margin.

    CRASH-SAFETY: the exact M-158/M-159 repro (165k depth, image, +8192
    tokens) SURVIVED in 17.2s - close to the nocacheram hand-tuned sibling's
    14.2s on the same test (same engine family, expected). Mild agentic soak
    (4 cycles, 32 turns, 8 screenshots, clean/uncontested run after an
    earlier attempt was invalidated by overlapping with the orchestrator
    benchmark - see decision log): zero failures, RestartCount 0, memory
    drift 31→28 GiB available - within normal noise, not a leak pattern.

    REAL ORCHESTRATOR BENCHMARK (run 169, committed alongside this file) vs
    the hand-tuned `-b 8192 -ub 8192` sibling's own real numbers
    (...-ub8192-cram14g-strixhalo-mtp-v1, run committed 2026-10-06):
    prefill 1009-1082 tok/s across 8k-131k depth - a real **36-39% SLOWER**
    than the hand-tuned build's 1590-1751 tok/s at the same depths. Decode is
    essentially identical either way (27-41 tok/s across all
    concurrency/depth combinations for both - noise-level difference). Since
    `-b`/`-ub` were left unset specifically so fit could size them, and
    ctx/ngl/weights loaded identically to the hand-tuned build, the most
    likely explanation is fit chose a smaller batch/ubatch than our explicit
    8192 - prefill throughput is batch-size-sensitive in a way decode
    generally isn't. Not confirmed via an explicit log line (this box's
    pinned llama-server doesn't support `-fitp`, and `--load-mode
    none --lazy-mode on-direct` suppresses the verbose per-buffer startup
    log that would show it directly) but it is the only variable that
    changed and that this benchmark shape is sensitive to.

    VERDICT: TESTED_NOT_VIABLE as a replacement for hand-tuning. `--fit`
    correctly reproduced our hand-picked context size on this hardware, and
    the build is correct and crash-safe - but it costs ~37% of prefill
    throughput (almost certainly from leaving batch/ubatch unset) for no
    measured benefit, and - as established before this build was even
    started (see MOTIVATION/SOURCE-LEVEL FINDING above) - it still cannot
    size or cap `--cache-ram`, the actual lever behind both of M-160's real
    OOM incidents. Hand-tuning remains the better-controlled approach for
    every flag it's currently pinning. Not promoted to standing - closed
    research trial, no further action planned. If `--fit` is revisited
    later, leave `-b`/`-ub` explicit and only let it size `-ngl`/`-c`, to
    isolate whether this prefill cost was really batch-size-driven.
