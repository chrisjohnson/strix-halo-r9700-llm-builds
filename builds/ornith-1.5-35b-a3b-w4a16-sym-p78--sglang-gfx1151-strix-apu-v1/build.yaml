name: ornith-1.5-35b-a3b-w4a16-sym-p78--sglang-gfx1151-strix-apu-v1
status: TESTING
derived:
  engine: sglang-gfx1151-v1
  model: Ornith-1.5-35B-A3B
  params: 35B
  active_params: 3.3B
  quant: W4A16-SYM + dense/lm_head-int4 (patches 7+8)
  mtp: false
  dflash: false
  target_gpu: strix-apu
  notes: >-
    M-139 (2026-09-01). Chris: "can we use this to run ornith 1.5 now
    that we see how well it works? Same quant and context as my existing
    build" (context corrected mid-task: "go up to the maximum context").
    Applies the proven SGLang patches 1-8 recipe (real, working,
    benchmarked on Qwen3.5-35B-A3B - see the sibling
    qwen3.5-35b-a3b-awq-4bit-p78 build) to our actual standing medium-moe
    model.

    First checkpoint tried (ulkaa/Ornith-1.5-35B-A3B-AWQ-INT4) hit a
    real, hard SGLang limitation, not a config mistake: its MoE experts
    are asymmetric AWQ (config.json: symmetric: false), and SGLang's own
    compressed-tensors MoE scheme (CompressedTensorsWNA16TritonMoE)
    hard-asserts symmetric-only:
      AssertionError: Only symmetric quantization is supported for MoE
    Confirmed via the full traceback (fails at model construction,
    before any weight loading) and by reading the checkpoint's own
    config.json directly. Unrelated to patches 7+8 (those only touch
    dense layers/lm_head, not the MoE expert path) - this is upstream
    SGLang's own hard limit, and Qwen3.5's earlier success only worked
    because that specific checkpoint happened to be symmetric.

    Switched to MIRALABS/Ornith-1.5-35B-A3B-W4A16-SYM - same
    Qwen3_5MoeForConditionalGeneration architecture, same compressed-
    tensors/pack-quantized format, confirmed symmetric: true via its own
    config.json before downloading (not guessed). Ran
    tools/quantize_nonexpert.py against it (same defaults, lm_head
    included): 191 tensors quantized (identical count to both prior
    runs - same architecture/layer count), 1.67GB saved, worst relative
    dequant error 0.14 (same magnitude as both prior runs - expected RTN
    error, not a bug). Output stored at
    /var/lib/ai-models/ornith-1.5-35b-a3b-w4a16-sym-miralabs-p78. Source
    checkpoint also includes a preserved MTP head (model-mtp.safetensors)
    - not used in this build, SGLang MTP support not yet attempted.

    Context: 262144 (the model's own native max_position_embeddings,
    confirmed via ornith-ai/Ornith-1.5-35B-A3B's config.json,
    rope_scaling: None) - Chris explicitly asked to go to the model's
    max rather than match the standing llama.cpp build's own 131072.
    --max-total-tokens 1048576 (1M) - KV cost is cheap for this hybrid
    attention+mamba architecture (confirmed on the Qwen3.5 test: 524288
    tokens = only 10GB).

    Same launch config pattern as the working Qwen3.5 patches-7+8 build
    otherwise (--dtype float16, --mamba-ssm-dtype float16,
    SGLANG_AWQ_MOE_TRITON_ROCM=1, persistent Triton cache + TunableOp
    volumes, --enable-metrics).

    Comparison baseline (real, existing data, same box): standing
    ornith-1.5-35b-a3b-mtp-q4--llamacpp-vulkan-radv-strix-apu-v3 (MTP,
    Q4_K_M, -c 131072): aggregate tok/s ctx=0: 67/65/63/67 (c=1/2/4/8).

    Not yet tested - checkpoint requantized, container not yet brought
    up.
