name: docker
services:
  qwen2.5-vl-7b-instruct--vllm-therock-gfx1151-strix-apu-v1:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: qwen2.5-vl-7b-instruct--vllm-therock-gfx1151-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp:unconfined
    ipc: host
    volumes:
    - /var/lib/ai-models:/models
    - vllm-qwen2.5-vl-7b-instruct-cache:/root/.cache/vllm
    command: 'vllm serve /models/qwen2.5-vl-7b-instruct --served-model-name qwen2.5-vl-7b-instruct
      --host 0.0.0.0 --port 8000 --tensor-parallel-size 1 --gpu-memory-utilization
      0.20 --dtype auto --trust-remote-code --enable-prefix-caching --max-model-len
      32768

      '
    ports:
    - 127.0.0.1:8010:8000
volumes:
  vllm-qwen2.5-vl-7b-instruct-cache:
    external: true
    name: docker_vllm-qwen2.5-vl-7b-instruct-cache
