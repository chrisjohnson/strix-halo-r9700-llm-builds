name: docker
services:
  qwen3.6-35b-a3b--llamacpp-vulkan-radv-mtp-strix-apu-v2:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: qwen3.6-35b-a3b--llamacpp-vulkan-radv-mtp-strix-apu-v2
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/llamacpp-qwen3.6-35b-a3b-mtp:/models:ro
    command: 'llama-server -m /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf -dev Vulkan1
      -ngl 999 -fa 1 --spec-type draft-mtp --spec-draft-n-max 3 -np 1 -c 131072 -n
      8192 -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080 -a qwen3.6-35b-a3b-mtp --metrics

      '
    ports:
    - 127.0.0.1:8109:8080
