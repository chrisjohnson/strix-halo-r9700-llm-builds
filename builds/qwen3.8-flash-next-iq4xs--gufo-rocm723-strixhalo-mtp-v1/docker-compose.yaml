# gufo - kyuz0's purpose-built Strix Halo inference engine, NOT a llama.cpp fork.
# Included because its own published figure is the highest seen for this model on
# this hardware: 1,628.52 tok/s pp on Qwen3.8-Flash-Next Q4_K_XL, 59.41 tok/s
# single-user decode, 157.22 aggregated across 8 concurrent with MTP. Compare
# against this repo's ~500 tok/s prefill on the same silicon.
# See knowledge/research/2026-09-27-strix-halo-engine-landscape.md.
#
# Deliberate choices, each so that ENGINE is the only variable against this
# repo's own builds:
#   - the target is OUR UD-IQ4_XS shards, not gufo's usual Unsloth UD-Q4_K_XL
#     (111.3GB), so weights are identical across the comparison
#   - --sessions 1 and --context 262144 mirror this repo's `--parallel 1 -c
#     262144`; gufo's own default is --sessions 2, which is a further experiment
#   - the shared-embedding MTP head, because that is the variant gufo's docs
#     name (the non-shared head this repo uses elsewhere is a different file)
#
# PODMAN-ISMS REMOVED from gufo's documented command: it passes
# --userns=keep-id and --group-add keep-groups, which are podman features. Under
# docker the equivalent is explicit numeric group-add, as below.
#
# DEPENDS ON a model that is committed but not yet deployed: the shared MTP head
# lands at /var/lib/ai-models/qwen3.8-flash-next-mtp-shared-q8/MTP/ via the
# local-ai-machine commit that adds it. Until that is deployed this build will
# start and fail to find its draft head.
services:
  qwen3.8-flash-next-iq4xs--gufo-rocm723-strixhalo-mtp-v1:
    image: ghcr.io/gufo-org/toolboxes/gufo-runtime:latest
    container_name: qwen3.8-flash-next-iq4xs--gufo-rocm723-strixhalo-mtp-v1
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "26"    # video
      - "303"   # render
    ulimits:
      memlock: -1
    volumes:
      - /var/lib/ai-models/qwen3.8-flash-next-iq4xs:/models:ro
      - /var/lib/ai-models/qwen3.8-flash-next-mtp-shared-q8:/mtp:ro
    ports:
      - "127.0.0.1:8181:8080"
    command: >-
      gufo serve --host 0.0.0.0 --port 8080 llm
      --model /models/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
      --speculative mtp
      --mtp-model /mtp/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      --sessions 1
      --context 262144
    restart: unless-stopped
