name: qwen-image-2.1--stable-diffusion-cpp-vulkan-radv-strix-apu-v1
status: WORKING
derived:
  engine: stable-diffusion-cpp-vulkan-radv-v1
  model: Qwen-Image-2.1 (7B DiT, unified gen+edit, Qwen3-VL 8B text encoder)
  params: 7B
  active_params: null
  quant: Q8_0
  mtp: false
  dflash: false
  target_gpu: strix-apu
  notes: >-
    M-149 (2026-09-20). First image-generation build in this catalog —
    new engine (stable-diffusion.cpp, not llama.cpp: llama.cpp cannot
    load the qwen_image architecture and llama-server has no
    image-output endpoint at all, confirmed via upstream issue tracker).
    Vulkan/RADV chosen over ROCm/HIP because it needs no gfx-target
    build flag and this catalog already has this exact APU proven on
    that backend for every other Strix build (HIP would need
    GPU_TARGETS=gfx1151, a less-traveled path here).

    Takes over Ornith's APU slot (ornith-1.5-35b-a3b-mtp-q4--
    llamacpp-vulkan-radv-strix-apu-v8 removed from local-ai-machine's
    standing-models.txt as part of this same change).

    Q8_0 chosen for v1 as a quality baseline (7.69GB DiT + ~8.7GB text
    encoder + VAE, comfortably inside the APU's freed-up memory budget)
    — not yet benchmarked. llm-inference-bench's harness is
    tokens/sec-only and doesn't apply to this modality; benchmarking
    this build means a custom wall-clock-per-image timing script
    (benchmarks/bench-images.sh) against a small step/resolution grid,
    not the standard bench matrix below.

    Real `sd-server --help` run against the built image (not guessed):
    confirmed --diffusion-model/--vae/--llm/--llm_vision/--diffusion-fa/
    --cfg-scale/--sampling-method/--listen-ip/--listen-port all exist as
    expected. One real correction from the initial draft: there is no
    --device flag (that's a llama.cpp-ism) — GPU pinning here is
    --backend <name>, and --list-devices confirms device 1 (`Vulkan1`)
    is the Strix APU (AMD Radeon 8060S, RADV GFX1151, uma:1) vs device 0
    (`Vulkan0`, the R9700 eGPU) — matches Ornith's own Vulkan1-is-the-APU
    convention. Also caught and fixed during the build: the CMake target
    is `sd-cli`, not `sd` (examples/cli/CMakeLists.txt names it
    explicitly) — first build attempt failed on this before the
    Dockerfile was corrected.

    Confirmed WORKING (2026-09-21): loads cleanly, all 16.4GB of weights
    (text_encoders 8.4GB + diffusion 7.3GB + vae 0.6GB) resident on
    Vulkan1 (the Strix APU) per its own auto-fit log — comfortably inside
    the 127GB it now sees free after Ornith's slot was freed. Real
    end-to-end image generated successfully through litellm's `image-gen`
    role (`/v1/images/generations` -> port 8200 -> 200 OK).

    First real benchmark (bench-images.sh, /sdapi/v1/txt2img, 1024x1024,
    a lovely-cat prompt): 4 steps = 59.6s, 20 steps = 263.8s. Linear fit:
    ~12.7s/step marginal cost, ~8s fixed overhead (text-encoder forward
    pass + VAE decode, paid once per image regardless of step count).
    This is APU memory-bandwidth-bound territory, consistent with every
    other build's finding on this hardware. Important real constraint:
    litellm's role goes through `/v1/images/generations`
    (OpenAI-compatible), which has NO steps field in its real schema at
    all (confirmed: two "20 vs 40 steps" calls against it came back
    statistically identical, both silently using the server's own
    default of 20) - so every image routed through the `image-gen` role
    costs the full ~264s regardless of what a caller asks for, until v2
    either bakes a different --steps default into the compose command or
    someone calls the native `/sdapi/v1/txt2img` route directly instead
    of going through litellm.

    Not yet tuned beyond the above. Real candidates for v2, unexplored so
    far: a lower quant (Q5_0/Q4_K) to test whether the bandwidth-bound
    profile responds the same way llama.cpp builds on this box do; the
    `--cache-mode easycache`/`--cache-mode dbcache` DiT step-skipping
    options `sd-server --help` surfaces (no LLM-decode equivalent to
    compare against, diffusion-specific); and whether a lower default
    --steps in the compose command (traded against quality) is the right
    call given litellm callers can't override it per-request anyway.
