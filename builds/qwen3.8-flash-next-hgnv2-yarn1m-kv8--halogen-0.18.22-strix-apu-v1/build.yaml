name: qwen3.8-flash-next-hgnv2-yarn1m-kv8--halogen-0.18.22-strix-apu-v1
status: TESTED_VIABLE
derived:
  engine: halogen-flash-server-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: halogen-native-v2 (4.16 bits/weight avg, calibrated precision placement)
  mtp: true
  dflash: false
  target_gpu: strix-apu
  vision: true
  notes: >-
    Image 0.18.22, same env as the yarn1m@0.18.4 build plus HALOGEN_KV8=1
    (8-bit KV cache; vendor figures: ~2% decode cost, KV pool roughly
    halved, incompatible with HALOGEN_COMPOSABLE_CONTEXT). Same weights and
    sidecars. Port 8218. 
    2026-11-02 results. Startup: KV pool 16.3 GiB (int8) instead of 28.8,
    "host memory left for everything else" 22.8 GiB (2268 contiguous 2 MiB
    blocks, vs 9.9 GiB / 198 without KV8). With Swift 27B FP8 co-resident,
    min MemAvailable was 17.4 GiB during the quick screen and 18.2 GiB during
    the full bench (0.18.22 without KV8: 5.3-5.75 GiB; 0.18.4: 3.65 GiB).
    Full orchestrator bench (concurrency 1,4; contexts to 1M): decode c1
    59.7 / 53.6 / 62.4 / 55.3 / 54.4 / 58.5 / 52.3 tok/s at 0 / 16k / 32k /
    64k / 128k / 512k / 1M; c4 aggregate 94.4 / 90.6 / 88.2 / 92.8 / 85.7 /
    60.1 / 35.7; prefill 2762-2917 tok/s from 8k to 128k. No measurable
    decode or prefill cost versus the same image without KV8 (single-run
    cells vary by about 10 percent). c4 at 1M read 35.7 against 41.9
    without KV8; not repeated. A real 1,017,070-token request completed
    (decode 57.4 tok/s, prefill 1400 tok/s). Tool-call checks as on the
    non-KV8 build (same results).
bench:
  concurrency: "1,4"
  contexts: "0,16384,32768,65536,131072,524288,1048576"
  duration: 30
