# Engine-bump trial of the yarn1m build: image 0.18.22 with an 8-bit KV cache (HALOGEN_KV8=1).
# Same checkpoint, sidecars, 1M-position pool and YaRN factor as the
# qwen3.8-flash-next-hgnv2-yarn1m--halogen-strix-apu-v1 build; only the image tag and the env lines below differ.
# Weights are mounted from the existing /var/lib/ai-models paths.
# No com.local-ai-machine.always-up label: not part of the standing set.
services:
  qwen3.8-flash-next-hgnv2-yarn1m-kv8--halogen-0.18.22-strix-apu-v1:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.18.22
    container_name: qwen3.8-flash-next-hgnv2-yarn1m-kv8--halogen-0.18.22-strix-apu-v1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "26"    # video
      - "303"   # render
    ipc: host
    ulimits:
      memlock: -1
    environment:
      HALOGEN_CHECKPOINT: /native-ckpt/qwen38-flash-next-v2.hgn
      HALOGEN_VISION_TOWER: /models/qwen38-flash-next-vision.hgn
      HALOGEN_TOKENIZER: /models/tokenizer
      HALOGEN_BIND: "0.0.0.0"
      HALOGEN_API_PORT: "8731"
      HALOGEN_ROPE_YARN: "4"
      HALOGEN_CTX: "1048576"
      HALOGEN_WEIGHTS_LOCK: "1"
      HALOGEN_KV8: "1"
    volumes:
      - /var/lib/ai-models/qwen3.8-flash-next-hgnv2:/native-ckpt:ro
      - /var/lib/ai-models/halogen-flash-next-sidecars:/models
    ports:
      - "127.0.0.1:8218:8731"
    restart: unless-stopped
