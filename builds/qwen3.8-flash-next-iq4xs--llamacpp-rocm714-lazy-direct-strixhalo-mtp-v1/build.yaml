name: qwen3.8-flash-next-iq4xs--llamacpp-rocm714-lazy-direct-strixhalo-mtp-v1
status: TESTED_VIABLE
derived:
  engine: llamacpp-rocm714-lazy-direct-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: UD-IQ4_XS
  mtp: true
  dflash: false
  target_gpu: strix-apu
  notes: >-
    2026-09-27. RECOMMENDED APU BUILD - the largest single win found in this work, and it
    supersedes ...-strixhalo-mtp-v3 (+10.7-14.8% over v1) by another 22-29%.

    WHAT IT IS: the EngramHalo fork with PR #29030 ("qwen4exp/gemma4: gather lazy tensor rows
    with direct reads") applied. The PR is still OPEN upstream, so it is vendored as
    docker/qwen4exp-strix-halo-mtp/llama-cpp-29030-lazy-direct.patch and applied by
    Dockerfile.rocm-7.14-lazy-direct. It replaces the gather itself: llm_graph_input_ple::rows
    goes from an I32 index tensor fed to ggml_get_rows(per_layer_tok_embd, rows) to
    llm_graph_lazy_rows, built via lazy_reader() and filled by rows.set_rows(), so the gather
    stops reading the mmap'd tensor at all. Environment and every other flag match v3 exactly.

    FLAG RENAME, which matters operationally: the PR replaces `--tensor-read-lazy` with
    `--lazy-mode`, and `on` now means DIRECT READS rather than mmap demand-faulting. There is
    no separate `on-direct` value - `on` is it. A build on this image passing
    `--tensor-read-lazy on` will not start.

    MEASURED, real-corpus prompts, single stream, server-reported timings:

      requested  tokens    v1    v3(both)   PORT   port vs v1   port vs v3
            2k     2,409   337        387    483       +43.3%       +29.1%
            8k     9,400   371        416    504       +35.8%       +23.8%
           32k    35,301   326        361    434       +33.1%       +21.9%

    CONTROL FOR PAGE-CACHE WARMTH - this was checked, not assumed, because the first port
    run was faster than its own confirmation run and that is the signature of a warming
    cache rather than a real effect. v3 was stopped and re-measured on the same warm cache
    immediately after the port run:

      requested   v3 (first)   v3 (warm, now)   PORT (warm)
            2k           387              374           483
            8k           416              407           504
           32k           361              356           434

    v3 does not get faster with warmth - it measured marginally lower the second time - so
    the port's advantage is not a cache artefact.

    WHY THE PER-BUFFER-MMAP PATCH IS ABSENT, which is the one caveat: PR #29030 and the
    fork's own llama-cpp-qwen38-per-buffer-mmap.patch both rewrite
    src/llama-model-loader.{cpp,h}, and that patch neither applies nor reverses on top of the
    PR. The upstream Dockerfile already treats it as optional ("skipped as obsolete
    otherwise"), so this build follows its documented fallback. That means this A/B measures
    "PR #29030 present, per-buffer-mmap patch absent" against v3, which carries both. A
    control build with neither would isolate the PR alone; that has NOT been done, and it is
    the one thing that could change the attribution, so it is stated rather than glossed.

    CONTEXT - THIS REVERSES AN EARLIER RECOMMENDATION IN THIS REPO. The decision entry
    2026-09-27-29030-port-deprioritised-measure-floor-first.md advised against starting this
    rebase, on the reasoning that the fork already implements batched row prefetch via its own
    prefetch_rows() and that the lazy path is not the bottleneck. That reasoning was wrong:
    the fork's prefetch_rows() does something different (it queues mmap faults for a gather
    that still reads the mapping) and the PR is worth 22-29% on top of it. The port was
    cheaper than expected too - 19 of 21 files applied cleanly and the rest were offsets.


    STANDARD BENCH (llm-inference-bench, run 163, 2026-09-27T200004Z) - the catalog's own
    metric, which corroborates the custom prefill ladder above on the harness the rest of the
    catalog uses:

      prefill   8k     16k     32k     64k    128k    mean
      v1       614     597     559     498     422     538
      v3       665     651     609     538     451     583   (+8.3% vs v1)
      port     786     797     753     660     525     704   (+30.9% vs v1)

    Monotone and consistent at every rung, which is why it is quotable.

    Decode also improves, which was NOT expected when this build was promoted - the PLE gather
    runs on every token, not just during prefill, so removing the mmap fault serialisation
    helps decode too. Mean over the structurally comparable cells: aggregate +37.8%, and the
    more conservative per-request metric +25%; the port is faster in 12 of 14 such cells.

    TWO CELLS PER BUILD HAD TO BE EXCLUDED, and the reason matters for anyone reading raw
    results. Cells at (32768, c4) for v1 and (65536, c2) for the port report aggregate rates of
    81.2 and 113.9 tok/s - 4-7x their neighbours. They are not fast cells; they are
    STRUCTURALLY DIFFERENT cells. Their ttft_avg is ~40 s against ~0.18 s for every other cell,
    i.e. they contain a cold prefill where the rest are prompt-cache hits. Including them
    inflates the port's decode mean to +38% and DEPRESSES v3's to -18.2%, which is how a
    headline number gets built out of two cells. Excluded, with the ttft_avg test stated so the
    exclusion is reproducible rather than hand-picked.

    CAVEAT on the decode figure: the container's bench tool is the pre-fix build (no fixed
    sampling seed), so cell-level output lengths vary run to run. A systematic +25-38% across
    12 of 14 cells is unlikely to be sampling luck, but decode here is worth +-5 points and a
    confirmation run with the fixed-seed tool would firm it up.

    NOT ADOPTED: v1 still runs 8152 and is still what litellm's `big-moe` role points at.
    Adopting this means repointing that role to 127.0.0.1:8178 or changing the standing
    build - Chris's call per AGENTS.md. It is a genuine change of engine, not a flag, so it
    should be a deliberate swap.

    HOW TO REBUILD THE IMAGE this build references (it is local to the box, not in a
    registry - these engine images are built by hand, unlike llm-inference-bench):

      cd docker/qwen4exp-strix-halo-mtp
      docker build -f Dockerfile.rocm-7.14-lazy-direct \
        -t strix-halo-r9700-llm-builds/qwen4exp-strix-halo-mtp:rocm-7.14-lazy-direct .

    Everything that needs to be checked in IS checked in: that Dockerfile, the vendored PR
    patch, the #25992 patch it also applies, and the fork commit is pinned by ARG COMMIT.
    See docker/qwen4exp-strix-halo-mtp/README.md for all three Dockerfiles in that directory
    and which builds use which.

    HONEST GAP on that Dockerfile: the image measured here was NOT produced from it. It was
    produced from an equivalent COPY-based Dockerfile against a local checkout of the same
    fork commit with the same patches applied, because the port lived on a local branch with
    no remote to clone from. The checked-in clone-based Dockerfile is intended to reproduce
    it and pins the commit the tree was taken from, but it has NOT been executed - treat it
    as unverified until someone runs it and compares.

    REPRODUCING THE NUMBERS: the A/B used a real-text corpus via
    llm_decode_bench.py --context-file, not the synthetic padding generator, because a
    repeated-filler prompt cannot exercise the n-gram/PLE table (see
    knowledge/research/2026-09-27-prefill-bench-padding-trap.md). That corpus is
    deliberately NOT committed - it was harvested from both this repo and
    local-ai-machine, and contains credential-shaped strings from the latter, and this
    repo is public. scripts/build_bench_corpus.sh builds a deterministic equivalent from
    this repo alone; absolute rates will differ slightly on it, the build-to-build
    comparison does not.


    REPRODUCING THIS BUILD: see REPRODUCE.md in this build directory - image (tag
    plus the exact build or pull command), weights and where they go, the engine's
    non-obvious failure modes, and how to run it. The notes above carry what was
    measured and why.