name: occamy-1.0-mtp-q5--llamacpp-vulkan-radv-r9700-mtp-v1
status: TESTED_VIABLE
derived:
  engine: llamacpp-vulkan-radv-v1
  model: Occamy-1.0 (Q5_K_M, MTP, self-grafted)
  params: 35B
  active_params: 3B
  quant: Q5_K_M
  mtp: true
  dflash: false
  target_gpu: r9700-egpu-dock
  notes: >-
    2026-09-28 (M-152). Q5_K_M R9700 eGPU build, ported from the TESTED_VIABLE
    occamy-1.0-mtp-q4--llamacpp-vulkan-radv-r9700-mtp-v2 baseline (same
    -dev Vulkan0 / --mmproj-device Vulkan0, np 3 --kv-unified
    --kv-unified-per-slot 262144, q4_0 KV, --cache-ram 32768, MTP n-max 2 /
    p-min 0.3). Only the quant and model file differ.

    Weights are the self-grafted Q5_K_M build (same pipeline as the strix-apu
    Q5 build in this catalog: bf16 Accio-Lab/occamy-1.0 base +
    fetchingcat/model-mtp.safetensors + imatrix.dat, converted via
    ggml-org/llama.cpp:full's convert_hf_to_gguf.py, then quantized with the
    kyuz0 toolbox's llama-quantize using fetchingcat's imatrix.dat). File at
    /var/lib/ai-models/occamy-1.0-mtp-q5/occamy-1.0-mtp-Q5_K_M.gguf
    (25,347,532,576 bytes / ~23.6 GiB).

    VRAM budget: Q5_K_M weights are ~23.6 GiB vs Q4_K_M's ~20.2 GiB (+3.4 GiB).
    KV at q4_0, np 3, 262144 tokens/slot is ~4.2 GiB (same as Q4 - KV is
    determined by model config, not weight quant). Plus mmproj F16 (~0.84 GiB)
    and compute buffers. Total expected ~28.6 GiB of the R9700's 31.86 GiB -
    ~3.2 GiB margin, comfortably in VRAM with no GTT spill expected. To be
    confirmed on first launch by reading card0's vram_used/gtt_used.

    Not yet benchmarked on the R9700. Sweep plan: prefill 8k/32k and decode
    ctx 0/16384, matched against the Q4 v2 baseline (2189/1630 tok/s at
    8k/32k prefill, 87/80 tok/s decode at ctx 0/16384).

    OPERATIONAL WARNING: the Vulkan backend does NOT fail when VRAM is
    exhausted, it silently allocates into host GTT. Never bring two R9700
    builds up at once, and always check card0's vram_used/gtt_used after
    starting one.


    REPRODUCING THIS BUILD: see REPRODUCE.md in this build directory - image (tag
    plus the exact build or pull command), weights and where they go, the engine's
    non-obvious failure modes, and how to run it. The notes above carry what was
    measured and why.

    HEALTH CHECK 2026-09-28, done before promoting it to standing, and it PASSES:
      - FITS: with it loaded the R9700 shows 30.7 GiB of VRAM used of 31.9 total, against the q4
        build's 29.0. So Q5 fits with about 1.2 GiB of headroom - less than q4's 2.9 GiB, which is
        the cost of the higher quant and worth knowing before adding anything else to that card.
      - BOOTS AND SERVES: modelctl up brings it healthy and primes it; /health returns 200.
      - WORKS: at the role's declared maxTokens of 8192 it answers a hard multi-step prompt
        properly - finish=stop, 656 characters of content ending in the right conclusion, with
        2214 characters of reasoning. At a 64-token cap it returns empty content instead, which
        is the same thinking-budget asymmetry documented for flash-next: the cap ends generation
        before the think block closes. It does NOT bite at 8192, which is what medium-moe uses.

    PORT MOVED 8172 -> 8191. It was created on 8172, which this repo had already assigned to
    qwen3.8-flash-next-iq4xs--llamacpp-rocm714-strixhalo-mtp-v2 - a cross-model clash where
    whichever starts second fails. The newcomer moved, since the older build's port is referenced
    in its own docs. The q6 r9700 build had the same collision on 8173 and moved to 8192.

    Being promoted to standing alongside the tuned flash-next build on the APU.
