# qwen3.8-27b-fp8--radiance-hip-r9700-v2: Radiance (HIP/ROCm, RDNA4) on the R9700 only, --tp 1.
# See build.yaml for the engine, memory and port rationale.
# No `com.local-ai-machine.always-up` label: not part of the standing set.
name: docker
services:
  qwen3.8-27b-fp8--radiance-hip-r9700-v2:
    image: docker.io/stilldeadcode/radiance:1.14.0
    container_name: qwen3.8-27b-fp8--radiance-hip-r9700-v2
    init: true
    user: "1000:1000"
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - "26"
    - "303"
    security_opt:
    - seccomp=unconfined
    ulimits:
      memlock: -1
    mem_limit: 16g
    oom_score_adj: 500
    stop_grace_period: 60s
    environment:
    - ROCR_VISIBLE_DEVICES=1
    volumes:
    - /var/lib/ai-models/radiance-qwen3.8-27b-fp8:/models:ro
    command: >-
      --model /models/qwen3.8-27b-fp8.rad
      --host 0.0.0.0 --port 8080
      --served-model-name qwen3.8-27b-fp8-r9700-radiance
      --tp 1 --vision-tower-placement ram
      --kv-cache-dtype fp8 --max-num-seqs 2 --max-model-len 65536
    ports:
    - 127.0.0.1:8215:8080
