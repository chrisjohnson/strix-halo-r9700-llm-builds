name: docker
services:
  qwen3.8-27b-q6kl--llamacpp-vulkan-radv-r9700-mtp-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: qwen3.8-27b-q6kl--llamacpp-vulkan-radv-r9700-mtp-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/qwen3.8-27b-q6kl:/models:ro
    command: 'llama-server -m /models/Qwen3.8-27B-Q6_K_L.gguf -dev Vulkan0 -ngl 999
      -fa 1 --spec-type draft-mtp --spec-draft-n-max 3 --spec-draft-p-min 0.6 -np
      1 -c 262144 -n 8192 -ctk q4_0 -ctv q4_0 --cache-ram 2048 --host 0.0.0.0 --port
      8080 -a qwen3.8-27b-q6kl-r9700-mtp --metrics

      '
    ports:
    - 127.0.0.1:8141:8080
