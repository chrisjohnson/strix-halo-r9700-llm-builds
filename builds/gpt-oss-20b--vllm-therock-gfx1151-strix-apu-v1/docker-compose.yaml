name: docker
services:
  gpt-oss-20b--vllm-therock-gfx1151-strix-apu-v1:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: gpt-oss-20b--vllm-therock-gfx1151-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp:unconfined
    ipc: host
    volumes:
    - /var/lib/ai-models:/models
    - vllm-gpt-oss-20b-cache:/root/.cache/vllm
    command: 'vllm serve /models/gpt-oss-20b --served-model-name gpt-oss-20b --host
      0.0.0.0 --port 8000 --tensor-parallel-size 1 --gpu-memory-utilization 0.90 --dtype
      auto --trust-remote-code --enable-prefix-caching --max-model-len 131072 --enable-auto-tool-choice
      --tool-call-parser openai --reasoning-parser openai_gptoss

      '
    ports:
    - 127.0.0.1:8005:8000
volumes:
  vllm-gpt-oss-20b-cache:
    external: true
    name: docker_vllm-gpt-oss-20b-cache
