name: docker
services:
  north-mini-code-1.0-w4a16--vllm-therock-gfx1151-strix-apu-v1:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: north-mini-code-1.0-w4a16--vllm-therock-gfx1151-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp:unconfined
    ipc: host
    volumes:
    - /var/lib/ai-models:/models
    - vllm-north-mini-code-1.0-w4a16-cache:/root/.cache/vllm
    command: 'vllm serve /models/north-mini-code-1.0-w4a16 --served-model-name north-mini-code-1.0
      --host 0.0.0.0 --port 8000 --tensor-parallel-size 1 --gpu-memory-utilization
      0.90 --dtype auto --trust-remote-code --enable-prefix-caching --max-model-len
      320000 --enable-auto-tool-choice --tool-call-parser cohere_command4

      '
    ports:
    - 127.0.0.1:8011:8000
volumes:
  vllm-north-mini-code-1.0-w4a16-cache:
    external: true
    name: docker_vllm-north-mini-code-1.0-w4a16-cache
