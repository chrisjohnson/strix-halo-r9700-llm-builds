name: qwen3.8-flash-next-iq4xs--llamacpp-rocm100-lazy-direct-budget-mmproj-effort-medium-ub8192-cram14g-strixhalo-mtp-v1
status: TESTED_VIABLE
derived:
  engine: llamacpp-rocm100-lazy-direct-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: UD-IQ4_XS
  mtp: true
  dflash: false
  target_gpu: strix-apu
  vision: true
  notes: >-
    Adopted tuning pass for Chris's real multi-session DSH usage: 3-5 long-horizon
    sessions (1-3 days each, regularly hitting 256k and compacting), 2+ genuinely
    concurrent (running work at the same time, not just idle-open). A separate
    chatbot session had proposed `--parallel 4 -c 1048576 -ctk q4_0 -ctv q4_0 -t 16`
    to "make the cache survive"; that config is not just suboptimal but IMPOSSIBLE
    on this engine (q4_0/q8_0 KV hard-asserts f16-only at qwen4exp.cpp:1365, and
    -t 16 has no basis anywhere in this repo). Real investigation this session:

    MULTI-SLOT IS DEAD, CONFIRMED TWO WAYS. `--parallel 2` without `--kv-unified`
    crash-loops immediately at load: `GGML_ASSERT(seq_id >= 0 && (size_t) seq_id <
    seq_to_stream.size())` in llama-kv-cache.cpp, inside
    llama_model_qwen4exp::graph::build_qsa_top_k - the hybrid-memory architecture's
    sequence-to-stream mapping does not support multiple streams in this engine
    build. `--parallel 2 --kv-unified` (the theoretically correct flag combo, from
    the prior sweep's budget-par2 build) avoids that assertion but fails later:
    `failed to allocate compute pp buffers` - does not fit regardless.

    SO THE LEVER IS --cache-ram, NOT --parallel. With --parallel 1 kept, one
    active GPU slot exists, but llama.cpp additionally keeps host-RAM snapshots
    ("prompt cache entries") of recently-seen prompt prefixes (PR #16391). A
    session preempted by another gets evicted from the ACTIVE slot but can still
    resume from a RAM snapshot - fast - instead of a full re-prefill from raw
    text, IF the snapshot hasn't itself been evicted from the (small, 8192 MiB
    default) cache-ram pool. This does not restore concurrency (--parallel 1
    still serializes requests server-side, confirmed by the M-138 incident where
    a "stuck" session was actually queued behind another) - it shortens how long
    each session waits behind another's turn.

    A prior sweep (2026-09-28, budget-cacheram build) already tried bumping
    --cache-ram to 32768 (matching occamy) and found it inconclusive: identical
    82.2% cache hit, PP/TG a wash. But that test used a single ~31k-token replay,
    which fits inside the 8192 MiB DEFAULT with room to spare - it could not
    exercise the lever at all. Blindly copying occamy's 32 GiB cap was also
    rejected on separate grounds: it is literally the configuration that caused
    this box's one real OOM hang (on occamy, 2026-09-29, via Prometheus telemetry
    in knowledge/research/2026-09-29-occamy-cache-ram-midnight-hang.md, local-ai-machine repo).

    MEMORY REALITY CHECK (before sizing anything): live Prometheus
    node_memory_MemAvailable_bytes over 48h showed the box does NOT hold a flat
    number - it swings 0-25 GiB depending on a fill-then-plateau cycle after each
    restart. The number that matters is the SUSTAINED FLOOR once caches are warm:
    a 10.5-hour flat plateau (2026-09-30 04:05-14:35) sat at 2.2-3.3 GiB. Chris's
    own recollection of "8-9 GiB free" was real but transient (a post-restart
    reading, matching 8.3-9.79 GiB seen shortly after two different restarts in
    the same 48h window) - not the number to size against.

    -ub/-b MEASURED as the memory-freeing lever, since compute buffers (not KV,
    which is a fixed ~6.3 GiB f16-only regardless of -ub) scale with ubatch.
    Measured on this exact engine with a real ~118k-token non-repeating synthetic
    prompt via the server's own /completion timings (the prior sweep's bench
    corpus/venv no longer existed to reuse):

      -ub 16384 (base)   PP 786.3 tok/s   GTT ~88.2 GiB (idle, single slot)
      -ub 8192           PP 739.2 tok/s   GTT ~83-85 GiB   (-6% PP, ~4-5 GiB freed)
      -ub 4096           PP 619.8 tok/s   GTT ~80.6 GiB   (-21% PP, ~7.5 GiB freed)

    -ub 4096 rejected: only ~3 GiB more than -ub 8192 for 3.5x the throughput
    cost - clearly the worse point on the curve. See the sibling
    ...-ub4096-strixhalo-mtp-v1 build for the record.

    ADOPTED: -b/-ub 8192 (frees ~4-5 GiB, costs ~6% prefill, paid only on a cache
    miss) funding --cache-ram 14336 (default 8192 + 6144 MiB, i.e. +6 GiB), with
    Chris explicitly choosing to bank ~1 GiB of the freed memory as extra margin
    rather than spend all of it - net roughly -1 to -2 GiB against today's
    already-thin sustained floor, a deliberate, informed tradeoff rather than a
    guess, made after the occamy incident specifically to avoid repeating it.

    VALIDATION DONE: container builds, loads, serves `/health` -> ok and a real
    chat completion correctly, at the target flags (-c 262144 -ub 8192 --cache-ram
    14336). NOT YET DONE: a real soak test of steady-state memory impact over
    hours (the whole reason the "fits at the moment" mistake matters), and a real
    demonstration that a session switch-back actually gets a --cache-ram hit
    (faster resume) rather than just confirming the flag is accepted. NOT
    PROMOTED TO STANDING - Chris asked to review the diff/pros/cons first.
