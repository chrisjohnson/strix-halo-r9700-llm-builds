name: docker
services:
  qwen3.6-27b--llamacpp-vulkan-radv-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: qwen3.6-27b--llamacpp-vulkan-radv-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/ollama-qwen3.6-27b:/models:ro
    command: 'llama-server -m /models/Qwen3.6-27B-Q4_K_M.gguf -dev Vulkan1 -ngl 999
      -fa 1 -np 1 -c 131072 -n 8192 -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080
      -a qwen3.6-27b-llamacpp --metrics

      '
    ports:
    - 127.0.0.1:8119:8080
