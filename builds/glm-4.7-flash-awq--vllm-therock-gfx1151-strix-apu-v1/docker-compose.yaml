name: docker
services:
  glm-4.7-flash-awq--vllm-therock-gfx1151-strix-apu-v1:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: glm-4.7-flash-awq--vllm-therock-gfx1151-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp:unconfined
    ipc: host
    volumes:
    - /var/lib/ai-models:/models
    - vllm-glm-4.7-flash-awq-cache:/root/.cache/vllm
    command: 'vllm serve /models/glm-4.7-flash-awq --served-model-name glm-4.7-flash-awq
      --host 0.0.0.0 --port 8000 --tensor-parallel-size 1 --dtype auto --trust-remote-code
      --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser glm47 --reasoning-parser
      glm45 --max-model-len 65536

      '
    ports:
    - 127.0.0.1:8003:8000
volumes:
  vllm-glm-4.7-flash-awq-cache:
    external: true
    name: docker_vllm-glm-4.7-flash-awq-cache
