name: docker
services:
  glm-4.7-flash--llamacpp-vulkan-radv-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: glm-4.7-flash--llamacpp-vulkan-radv-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/ollama-glm-4.7-flash:/models:ro
    command: 'llama-server -m /models/GLM-4.7-Flash-Q4_K_M.gguf -dev Vulkan1 -ngl
      999 -fa 1 -lm none -c 65536 --host 0.0.0.0 --port 8080 -a glm-4.7-flash-judge
      --metrics

      '
    ports:
    - 127.0.0.1:8103:8080
