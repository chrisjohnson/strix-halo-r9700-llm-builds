name: docker
services:
  qwen3.5-122b-a10b-awq4bit--vllm-therock-gfx1151-strix-apu-v1:
    image: docker.io/kyuz0/vllm-therock-gfx1151:latest
    container_name: qwen3.5-122b-a10b-awq4bit--vllm-therock-gfx1151-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp:unconfined
    ipc: host
    volumes:
    - /var/lib/ai-models:/models
    - vllm-qwen3.5-122b-a10b-awq4bit-cache:/root/.cache/vllm
    environment:
    - VLLM_USE_TRITON_AWQ=1
    command: 'vllm serve /models/qwen3.5-122b-a10b-awq4bit --served-model-name qwen3.5-122b-a10b-awq4bit
      --host 0.0.0.0 --port 8000 --tensor-parallel-size 1 --max-num-seqs 512 --dtype
      auto --trust-remote-code --enable-prefix-caching --enable-auto-tool-choice --tool-call-parser
      qwen3_coder --reasoning-parser qwen3 --max-model-len 65536

      '
    ports:
    - 127.0.0.1:8007:8000
volumes:
  vllm-qwen3.5-122b-a10b-awq4bit-cache:
    external: true
    name: docker_vllm-qwen3.5-122b-a10b-awq4bit-cache
