name: qwen3.8-flash-next-iq4xs--llamacpp-rocm100-lazy-direct-strixhalo-mtp-v1
status: TESTED_VIABLE
derived:
  engine: llamacpp-rocm100-lazy-direct-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: UD-IQ4_XS
  mtp: true
  dflash: false
  target_gpu: strix-apu
  notes: >-
    2026-09-27. The engine behind the "1.2k t/s prefill on Strix Halo" result -
    pwilkin/llama.cpp@strix-halo on a custom retained-PM4 ROCr/HIP runtime, ROCm 10.0. Its
    writeup is the best-measured work in this space: 16+ commits each with error bars and a
    stated multiplier, negative results kept (its sparse-attention path measures break-even and
    it says so), the out-of-tree reference stack re-run the same day as a control, and a
    150,300-token needle-in-a-haystack test before trusting the sparse kernels. Route: 191 ->
    ~1,200 tok/s pp16384, i.e. 6.07x. See
    knowledge/research/2026-09-27-strix-halo-engine-landscape.md.

    THE RELATIONSHIP TO THIS REPO'S OWN BEST BUILD: this is the SAME mechanism we already ported
    as upstream PR #29030 and measured at +21.9-29.1% - "on-direct" lazy reading - but on a
    different engine with 15 further commits we do not have. The single largest of those is a
    TILED gated delta-net at 2.37x. That is the prize here, and it is kernel work rather than a
    flag. Our own GDN win (GGML_HIP_GDN_CHUNK=1, +7.4-10.7%) is the CHUNKED path, which their
    writeup explicitly measured at ~3% and dropped when compared against tiled - so the two
    results agree, and it is worth knowing they were reached independently.

    WHAT THEIR OWN DOCS WARN ABOUT, carried here because each would cost real time:
      - never set GGML_CUDA_ENABLE_UNIFIED_MEMORY. It routes allocation through
        hipMallocManaged, and under HIP graphs the MTP draft context corrupts - garbage tokens,
        or the server dying with "init: invalid token".
      - the custom /opt/strix/lib must stay on LD_LIBRARY_PATH and out of /etc/ld.so.conf, since
        it shadows the ROCm SDK's libamdhip64/libhsa-runtime64 by ordering.
      - under rootless Docker, do not use host networking: it masks /sys, /sys/class/kfd
        disappears, and ROCr reports no ROCm-capable device. This build publishes a port.
      - HIP graphs do NOT engage for prefill (each chunk shape occurs once per request and capture
        needs two consecutive identical graphs); retained PM4 pays off in decode. States so
        itself, which is why the prefill win is attributed to the kernels rather than the runtime.

    BLOCKERS, both one step each: the image is not built yet (see the compose header for the
    command), and the shared MTP head is committed to local-ai-machine but not deployed.

    MEASURED 2026-09-27 ON OUR WEIGHTS, AND IT IS THE FASTEST BUILD IN THIS CATALOG.

    Prefill, real corpus, single stream, server-reported timings:

      requested  tokens   pwilkin   our best (port)   ratio
            1k   1,437       368               385    0.96x
            2k   2,408       481               483    1.00x
            4k   5,072       617               473    1.30x
            8k   9,399       740               504    1.47x
           32k  35,300       769               434    1.77x

    THE SHAPE IS THE STORY: their rate RISES with context (368 -> 769 tok/s) while every other
    build in this repo is flat-to-declining (385 -> 434). Long context is the agentic regime, so
    the advantage grows exactly where it is worth most.

    Agentic replay, same history and compaction as every other build (scripts/agentic_compare.sh
    parameters):

      build                 cache hit  wall/turn  increment  compaction
      pwilkin rocm100           82.2%      6.78s   497 tok/s       27.4s
      lazy-direct (port)        82.1%      9.35s   403 tok/s       46.1s
      v3                        82.3%     10.67s   321 tok/s       54.9s
      v1 (before)               82.1%     11.83s   294 tok/s       59.4s

      vs the port build: increment +23%, wall/turn -27%, compaction -41%
      vs v1 (standing):  increment +69%, wall/turn -43%, compaction -54%

    Cache-hit fraction is identical across all four, so as before the gain is entirely in the
    increment and compaction terms.


    STANDARD BENCH (llm-inference-bench run 165, 20260928T050350Z) - the same harness as the
    recorded baseline, so these are directly comparable rather than an estimate:

      ctx     v1 (baseline)   v3    port    pwilkin    pwilkin vs baseline
      8k               614    665     786       1080    1.76x
      16k              597    651     797       1213    2.03x
      32k              559    609     753       1256    2.25x
      64k              498    538     660       1306    2.62x
      128k             422    451     525       1264    3.00x
      MEAN             538    583     704       1224    2.28x

    Decode at 64k, aggregate tok/s:

      build            c=1    c=2    c=4    c=8
      v1 (baseline)   14.4   11.8   13.7   11.6
      v3              12.1   18.9   12.1   12.0
      port            17.8  113.9*  17.7   15.1     (*the excluded cold-prefill outlier)
      pwilkin         33.9   26.6   24.5   24.1

    THE ANSWER, against the 498 / 14.4 baseline quoted for the "how far have we come" question:

      PP @64k  1306 tok/s  (+162%, 2.62x)
      TG @64k    33.9 tok/s (+136%, 2.36x)

    Two things worth reading off the shape rather than the single point:

    - Their prefill PEAKS at 64k (1306), dipping slightly at 128k (1264). Ours peaks early and
      declines. So 64k - an ordinary agentic session length - is where this engine is strongest
      relative to ours, and the 3.00x at 128k is the largest ratio anywhere in the table.
    - Their DECODE IS FLAT AND HIGH across every concurrency (33.9/26.6/24.5/24.1) where ours is
      both lower and erratic. That is a stability property, not just a speed one: it means four
      or eight concurrent agent turns do not degrade, which matters directly for subagents.

    An extrapolated estimate made before this run, from the real-text ratio at 4k/8k/32k
    (1.30/1.47/1.77, growing) anchored to our port build's 660, predicted 1,170-1,410 tok/s.
    Measured 1306. The estimate was sound, but the DECODE number was deliberately NOT
    estimated and that was right: the only prior data point was a single short-context cell at
    15.9 tok/s that hinted decode might be WORSE, and the truth is 2.36x better.

    THE CAVEAT THAT MATTERS, stated because it is the obvious next question: THIS IS NOT A PURE
    ENGINE COMPARISON. This build also runs different launch flags - the documented ones -
    notably --load-mode none and a 16384 batch/ubatch against our 2048, plus f16 KV where we
    settled on q8_0. A rate that improves with context is exactly what a much larger ubatch
    would produce, so the win may be substantially CONFIG, not only the tiled delta-net and the
    other 15 commits. The isolating experiment is cheap and is the top follow-up: run one of our
    own builds with --load-mode none -ub 16384 and see how much of the 1.77x survives. Our own
    -ub 8192 attempt blew the memory budget, but that was WITH mmap, and this config is not.

    Also worth noting what DID carry over: the engine loaded our UD-IQ4_XS weights without
    complaint (llama.cpp supports every quant format, gufo supports one), MTP works with our
    existing shared head, and it fits at 262144 context with 28GB of RAM to spare.
