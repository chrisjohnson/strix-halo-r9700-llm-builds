name: qwen3.8-flash-next-hgnv2-yarn1m--halogen-0.18.22-strix-apu-v1
status: TESTED_VIABLE
derived:
  engine: halogen-flash-server-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: halogen-native-v2 (4.16 bits/weight avg, calibrated precision placement)
  mtp: true
  dflash: false
  target_gpu: strix-apu
  vision: true
  notes: >-
    Image 0.18.22 with the env of the yarn1m@0.18.4 build unchanged
    (HALOGEN_ROPE_YARN=4, HALOGEN_CTX=1048576, HALOGEN_WEIGHTS_LOCK=1).
    The vendor changelog for 0.18.5-0.18.22 lists the Flash checkpoints as
    unchanged, so the same weights and sidecars are reused. Port 8217.
    
    2026-11-02 results. Startup: KV pool 28.8 GiB, "host memory left for
    everything else" 9.9 GiB (198 contiguous 2 MiB blocks), identical pool
    and weights to the 0.18.4 build. Min MemAvailable during the full bench
    5.75 GiB, during the quick screen 5.3 GiB (0.18.4 build screened the same
    way: 3.65 GiB). Full orchestrator bench (concurrency 1,4; contexts to
    1M): decode c1 56.0 / 55.1 / 53.9 / 55.1 / 54.0 / 54.4 / 50.2 tok/s at
    0 / 16k / 32k / 64k / 128k / 512k / 1M (0.18.4 build: 51.0 / 49.9 / 50.1
    / 51.1 / 50.9 / 51.1 / 48.6); c4 aggregate 94.9 / 85.7 / 85.1 / 86.7 /
    84.9 / 57.1 / 41.9 (0.18.4: 82.0 / 81.1 / 76.7 / 77.3 / 77.2 / 49.1 /
    42.2); prefill 2769-2968 tok/s from 8k to 128k, 2842 at 128k (0.18.4:
    2541). The 0.18.4 numbers were measured without Swift resident. A real
    906k-token request completed (decode 58.8 tok/s, prefill 1430 tok/s).
    Tool-call checks (forced named call, two parallel calls, tool-result
    follow-up) pass; an argument containing a literal </tool_call> sequence
    is cut at that sequence, the same as on 0.18.4 and 0.18.17.
bench:
  concurrency: "1,4"
  contexts: "0,16384,32768,65536,131072,524288,1048576"
  duration: 30
