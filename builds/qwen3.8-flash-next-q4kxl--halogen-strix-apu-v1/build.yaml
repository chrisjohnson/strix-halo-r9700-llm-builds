name: qwen3.8-flash-next-q4kxl--halogen-strix-apu-v1
status: TESTED_NOT_VIABLE
derived:
  engine: halogen-flash-server-v1
  model: Qwen3.8-Flash-Next
  params: 177B
  active_params: 6B
  quant: UD-Q4_K_XL
  mtp: true
  dflash: false
  target_gpu: strix-apu
  vision: true
  notes: >-
    M-167. Sibling of qwen3.8-flash-next-iq4xs--halogen-strix-apu-v1 (M-165) -
    one variable changed: the checkpoint file. UD-Q4_K_XL is +17.6 GiB on disk
    over UD-IQ4_XS (111.3 GB vs 93.7 GB, per unsloth/Qwen3.8-Flash-Next-GGUF's
    real file sizes checked via the HF API). Downloaded fresh (4 shards,
    verified byte-exact against the HF API's reported sizes before use) to
    /var/lib/ai-models/qwen3.8-flash-next-q4kxl/UD-Q4_K_XL/. Same MTP/vision/
    tokenizer sidecars as M-165 (quant-independent).

    WHY HALOGEN, NOT HALO-BOX: per this card's own plan, host on whichever
    engine has real margin for the extra weight. halogen's measured total
    footprint for IQ4_XS was 100.0 GiB (M-165) vs halo-box's ~111.6 GiB for
    the SAME file - halogen had ~24 GiB of real slack on this ~124 GiB-usable
    box, halo-box had far less.

    FLAGGING BEFORE ANY BENCHMARK: this is genuinely tight. If Q4_K_XL's
    in-memory footprint scales with its +17.6 GiB on-disk size (expected,
    since GGUF weights are loaded close to 1:1), halogen's total should land
    near 100.0 + 17.6 ≈ 117.6 GiB - leaving only ~6-7 GiB of margin on this
    box, well below the >20 GiB margins every other build this session has
    run with, and in the same danger zone that caused both of M-160's real
    OOM incidents. This will be checked via real `free -h` readings
    immediately after boot, BEFORE running the crash-repro (which pushes
    context to 165k+ depth) - if idle margin is already thin, the repro
    itself could trigger a genuine system OOM rather than a safely-contained
    one, unlike every prior repro this session where starting margin was
    healthy.

    VALIDATED (2026-10-07), stopped short deliberately. Real `free -h`
    immediately after boot (occamy running concurrently on the other GPU,
    the actual target co-residency per Chris's stated use case - not an
    artificial single-model test): 6.0 GiB free / 10.0 GiB available, swap
    already at 4.3 GiB in use. The engine's own startup log confirmed the
    pre-written concern directly: "WARNING 15.1 GiB of host RAM is in use
    before this server starts... expect every prompt to read the table from
    disk, prefill to run several times slower than published" and
    automatically shrank the KV pool from the requested 524288 positions to
    262144 ("host RAM cannot spare it") - sacrificing exactly the
    long-context headroom this model exists to provide. Real weights
    resident: 79.6 GiB (vs IQ4_XS's 72.8 GiB - the +17.6 GiB on-disk delta
    translated almost 1:1 into RAM, as predicted).

    STOPPED before running the crash-repro - 10 GiB available at idle, with
    swap already engaged, is worse than the margin that preceded BOTH of
    M-160's real OOM incidents. Pushing a 165k-depth+vision+8192-token
    stress test on top of that risked a genuine uncontained system OOM, not
    a safely-survived repro. Stopping the container alone recovered margin
    to 110 GiB available, confirming this specific build was the entire
    cause, not a pre-existing problem.

    VERDICT: TESTED_NOT_VIABLE in Chris's real target configuration
    (occamy + flash-next co-resident). Q4_K_XL's extra weight does not fit
    this box with adequate safety margin on ANY engine tried, including
    halogen - the engine with the most real slack of the three alternatives
    evaluated this session. UD-IQ4_XS remains the right quant choice for
    this hardware. Not promoted to standing.

    FOLLOW-UP (2026-10-07, isolated/occamy-free re-test): prompted by a
    Reddit benchmark (u/unknown, ASUS ROG Flow Z13 GZ302, 128 GB, Strix
    Halo) showing Q4_K_XL running successfully on halogen and several other
    engines up to 256k context. Their box's OS-visible RAM (124.9 GiB post
    BIOS tweak) is essentially identical to ours (124.4 GiB) - ruled out a
    hardware/BIOS explanation. Re-ran this build with occamy stopped and
    everything else (always-up service stack) left running, to isolate the
    real bare ceiling: boot alone leaves 17 GiB available (vs 10 GiB with
    occamy up) - confirms occamy was a real but modest contributor, not the
    dominant factor. The dominant factor is simply that Q4_K_XL + halogen's
    own footprint (113.8 GiB) leaves only ~10 GiB of slack on a 124.4 GiB
    box even completely alone, before any other process touches it.

    Full isolated trajectory, real `free -h` available: 117 GiB (pre-boot)
    -> 17 GiB (post-boot) -> 16 GiB (after the M-158/M-159 crash repro,
    survived in 7.3s) -> 15 GiB (after a clean 4-cycle/32-turn mild soak,
    zero failures, RestartCount 0). A real, modest ~2 GiB downward drift
    across the stress sequence - not the dramatic unbounded climb that
    caused M-160's actual incidents, but also not perfectly flat, and this
    is only one short test (one before/after pair, not per-cycle readings,
    so a one-time settling effect vs. a genuine slow per-use cost can't yet
    be distinguished). Either way, 15-17 GiB is well below the >20 GiB
    margin this session has treated as safe since M-160, even in the best
    case with nothing else sharing the box. The Reddit data isn't
    contradicted by this - it shows Q4_K_XL CAN run on this hardware class,
    which is also true here; it just doesn't show whether their margin was
    comfortable, since they never reported `free -h` numbers, only that a
    ~20-minute benchmark didn't fall over.

    Still not promoted. UD-IQ4_XS remains the right choice for Chris's real
    operating conditions (hours-long sessions, concurrent occamy).
