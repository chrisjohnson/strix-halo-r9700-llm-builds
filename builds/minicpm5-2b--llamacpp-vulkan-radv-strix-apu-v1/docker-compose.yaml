name: docker
services:
  minicpm5-2b--llamacpp-vulkan-radv-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: minicpm5-2b--llamacpp-vulkan-radv-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - "26"
    - "303"
    volumes:
    - /var/lib/ai-models/minicpm5-2b:/models:ro
    command: "llama-server -m /models/MiniCPM5-2B-Q8_0.gguf -dev Vulkan1 -ngl 999
      -fa 1 -np 1 -c 131072 -n 8192 -ctk q8_0 -ctv q8_0 --host 0.0.0.0 --port 8080
      -a minicpm5-2b-llamacpp --metrics
      "
    ports:
    - 127.0.0.1:8166:8080
