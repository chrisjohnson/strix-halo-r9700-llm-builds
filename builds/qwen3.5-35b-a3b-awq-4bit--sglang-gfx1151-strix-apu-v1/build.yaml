name: qwen3.5-35b-a3b-awq-4bit--sglang-gfx1151-strix-apu-v1
status: TESTING
derived:
  engine: sglang-gfx1151-v1
  model: Qwen3.5-35B-A3B
  params: 35B
  active_params: 3.3B
  quant: AWQ-4bit
  mtp: false
  dflash: false
  target_gpu: strix-apu
  notes: >-
    M-139 (2026-08-31/09-01). Fallback after
    qwen3.6-35b-a3b-awq-4bit--sglang-gfx1151-strix-apu-v1 hit a real
    SGLang bug (Qwen3.6 routed through SGLang's Qwen3.5 model handler,
    KeyError on w2_qweight expert key naming - see that build's
    TESTED_NOT_VIABLE writeup). Chris: "Fall back" - test the fork's own
    proven-working checkpoint (cyankiwi/Qwen3.5-35B-A3B-AWQ-4bit).

    FIRST ATTEMPT (build.yaml previously said TESTED_NOT_VIABLE): server
    loaded and started listening but hung/timed out during its internal
    startup warmup request (600s ReadTimeoutError), inconsistently -
    sometimes a long stall, sometimes a fast internal TimeoutError.
    Chris pushed back on treating this as categorically "not viable" off
    one attempt, since the fork's own README publishes real measured
    throughput for this exact checkpoint. Root-caused properly instead of
    accepting the first negative result:

    Real root cause (confirmed via full traceback, not guessed): a
    genuine Triton compiler type-inference bug in upstream sglang's own
    mamba conv1d kernel (sglang/srt/layers/attention/mamba/
    causal_conv1d_triton.py). Its load-init-state branch infers
    col0..col3's dtype from the conv_states buffer (bf16, not responsive
    to --dtype or --mamba-ssm-dtype flags), while the no-prior-state
    branch explicitly types them via x_ptr.dtype.element_ty (float16,
    which AWQ requires). Triton's compiler can't unify bf16 and fp16
    across the branch merge:
      triton.compiler.errors.CompilationError: at 105:8: AssertionError
      ("Mismatched type for col0 between then block (<[...], bf16>) and
      else block (<[...], fp16>)")

    FIX: cast the loaded conv_states value to x_ptr's dtype in the
    load-init-state branch (mirrors what the else-branch already does).
    Added as "Patch 6" (local, not from upstream fork) in
    docker/strix-halo-sglang.dockerfile, image rebuilt via
    scripts/build-strix-halo-sglang.sh.

    RESULT AFTER THE FIX: real success. Server loads (23.4GB, ~13-48s),
    warmup completes, "The server is fired up and ready to roll!",
    real coherent completions served. First requests per new
    prompt-length/shape are slow (~2-4 tok/s, cold Triton JIT compile
    for that exact shape) but subsequent requests of an already-compiled
    shape run ~20 tok/s single-stream - in the range of the fork's own
    published 23.4 tok/s reference number. Mounted a persistent
    /root/.triton/cache volume (was only persisting /root/.tunableop
    before) so compiled kernels survive container restarts.

    Launch config (current, matches the fork's own documented reference
    in docs/RUNNING_AWQ_MOE.md exactly, changed from the first attempt's
    modified flags): --dtype float16 --mem-fraction-static 0.55
    --context-length 2048 --max-total-tokens 4096
    --max-mamba-cache-size 32 --attention-backend triton
    --disable-cuda-graph. SGLANG_FORCE_NATIVE_LAYERNORM=1,
    SGLANG_AWQ_MOE_TRITON_ROCM=1.

    Both Laguna AND Ornith stopped for this attempt (R9700/Dirk left
    running - Chris was actively using Dirk).

    Not yet run through llm-inference-bench for a proper concurrent
    throughput sweep - status left as TESTING pending that.
