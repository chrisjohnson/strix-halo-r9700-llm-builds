name: qwen3.5-35b-a3b-awq-4bit--sglang-gfx1151-strix-apu-v1
status: WORKING
derived:
  engine: sglang-gfx1151-v1
  model: Qwen3.5-35B-A3B
  params: 35B
  active_params: 3.3B
  quant: AWQ-4bit
  mtp: false
  dflash: false
  target_gpu: strix-apu
  notes: >-
    M-139 (2026-08-31/09-01). Fallback after
    qwen3.6-35b-a3b-awq-4bit--sglang-gfx1151-strix-apu-v1 hit a real
    SGLang bug (Qwen3.6 routed through SGLang's Qwen3.5 model handler,
    KeyError on w2_qweight expert key naming - see that build's
    TESTED_NOT_VIABLE writeup). Chris: "Fall back" - test the fork's own
    proven-working checkpoint (cyankiwi/Qwen3.5-35B-A3B-AWQ-4bit).

    FIRST ATTEMPT (previously recorded TESTED_NOT_VIABLE): server loaded
    and started listening but hung/timed out during its internal startup
    warmup request (600s ReadTimeoutError), inconsistently. Chris pushed
    back on treating this as categorically "not viable" off one attempt,
    since the fork's own README publishes real measured throughput for
    this exact checkpoint - correctly. Root-caused properly instead of
    accepting the first negative result:

    Real root cause (confirmed via full traceback, not guessed): a
    genuine Triton compiler type-inference bug in upstream sglang's own
    mamba conv1d kernel (sglang/srt/layers/attention/mamba/
    causal_conv1d_triton.py). Its load-init-state branch infers
    col0..col3's dtype from the conv_states buffer (bf16, not responsive
    to --dtype or --mamba-ssm-dtype flags), while the no-prior-state
    branch explicitly types them via x_ptr.dtype.element_ty (float16,
    which AWQ requires). Triton's compiler can't unify bf16 and fp16
    across the branch merge:
      triton.compiler.errors.CompilationError: at 105:8: AssertionError
      ("Mismatched type for col0 between then block (<[...], bf16>) and
      else block (<[...], fp16>)")

    FIX: cast the loaded conv_states value to x_ptr's dtype in the
    load-init-state branch (mirrors what the else-branch already does).
    Added as "Patch 6" (local, not from upstream fork) in
    docker/strix-halo-sglang.dockerfile, image rebuilt via
    scripts/build-strix-halo-sglang.sh.

    Chris then asked for a realistic context ceiling (130k+, matching our
    other real builds, not the fork's toy 2048-token reference config).
    Raised to --context-length 131072 --max-total-tokens 524288 - real
    per-token KV cost for this hybrid attention+mamba architecture is
    cheap (524288-token KV pool = only 10GB), confirmed safe with the
    full memory pool free. Also mounted a persistent /root/.triton/cache
    volume (was only persisting /root/.tunableop before) so compiled
    kernels survive container restarts - first-request-per-shape is slow
    (cold JIT compile) but subsequent requests of an already-compiled
    shape are fast.

    Two more real, fixed issues surfaced getting a clean benchmark run:
    (1) local edits I tested manually were never committed to git, so
    the benchmark orchestrator's own git sync silently reverted the
    container to a stale 8192-token config for every automated run -
    fixed by actually committing the verified-working compose.yaml;
    (2) llm-inference-bench requires --enable-metrics on the SGLang
    server for accurate server-side throughput measurement - added.

    REAL RESULTS (run 134, llm-inference-bench, metrics-backed, warm
    Triton cache) vs. our two existing same-size-class comparisons on
    this box:

    aggregate tok/s, ctx=0:      SGLang  21 / 32 / 56 / 83  (c=1/2/4/8)
                                  Ornith  68 / 61 / 61 / 66
                                  vLLM    15 / 24 / 36 / 40
    aggregate tok/s, ctx=32768:  SGLang  20 / 34 / 52 / 81
                                  Ornith  60 / 59 / 55 / 51
                                  vLLM    11 / 18 / 28 / 40
    aggregate tok/s, ctx=65536:  SGLang  20 / 32 / 49 / 78
                                  Ornith  51 / 54 / 53 / 48
                                  vLLM     9 / 15 / 24 / 32

    A real, genuinely mixed result, not a strict win or loss:
    - SGLang wins decisively on CONCURRENT throughput at real context
      depths (32k/65k): 50-65% higher than Ornith at concurrency=8, and
      2x+ vLLM's own BF16 numbers (confirming AWQ's real advantage over
      unquantized weights within the same continuous-batching engine).
    - SGLang loses badly on single-stream latency: Ornith's MTP
      speculative decoding gives it a real ~2.5-3x edge at concurrency=1
      (this build has no MTP - plain AWQ, no speculative decoding
      capability for this checkpoint).
    - This is the classic continuous-batching-vs-speculative-decoding
      tradeoff, now real and measured on our own hardware, not
      theoretical. Whether SGLang is the better choice for the
      medium-moe role depends on real usage pattern: bursty/concurrent
      (multiple simultaneous agents/users) favors SGLang; mostly
      single-user/interactive favors Ornith's MTP.
    - Not yet attempted: the fork's patches 7+8 (dense-layer + lm_head
      quantization), which their own numbers show closing/flipping the
      single-stream gap too (single-stream parity, 4.76x at 8 streams on
      their hardware) - a real, scoped next step if pursued further.

    Both Laguna and Ornith stopped for the benchmark run, restored and
    confirmed healthy immediately after. Container itself stopped after
    benchmarking (not needed to stay up) - real, reproducible build
    (image + compose + build.yaml all committed) ready to bring back up
    on request.
