name: docker
services:
  nvidia-nemotron-3-super-120b-a12b--llamacpp-vulkan-radv-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: nvidia-nemotron-3-super-120b-a12b--llamacpp-vulkan-radv-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/llamacpp-nemotron-3-super-120b:/models:ro
    command: 'llama-server -m /models/UD-Q4_K_XL/NVIDIA-Nemotron-3-Super-120B-A12B-UD-Q4_K_XL-00001-of-00003.gguf
      -dev Vulkan1 -ngl 999 -fa 1 -np 1 -c 131072 -n 8192 -ctk q8_0 -ctv q8_0 --host
      0.0.0.0 --port 8080 -a nemotron-3-super-120b --metrics

      '
    ports:
    - 127.0.0.1:8118:8080
