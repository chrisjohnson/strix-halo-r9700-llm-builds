name: docker
services:
  ornith-1.0-35b-mtp-q4--llamacpp-vulkan-radv-strix-apu-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: ornith-1.0-35b-mtp-q4--llamacpp-vulkan-radv-strix-apu-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    volumes:
    - /var/lib/ai-models/llamacpp-ornith-1.0-35b-mtp-q4:/models:ro
    command: 'llama-server -m /models/ornith-1.0-35b-MTP-Q4_K_M.gguf -dev Vulkan1
      -ngl 999 -fa 1 --spec-type draft-mtp --spec-draft-n-max 4 --spec-draft-p-min
      0.6 -np 1 -c 131072 -n 8192 -ctk q8_0 -ctv q8_0 --cache-ram 2048 --host 0.0.0.0
      --port 8080 -a ornith-1.0-35b-mtp-q4 --metrics

      '
    ports:
    - 127.0.0.1:8113:8080
