    measurement by running one at a time, not simultaneously.

    Purpose: isolate whether easycache's step-skipping meaningfully cuts
    the ~12.7s/step marginal cost v1 measured, independent of quant
    choice (that's a separate axis, see the -q5_0/-q4_k sibling builds).
