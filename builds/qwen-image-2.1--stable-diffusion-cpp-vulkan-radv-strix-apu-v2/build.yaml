name: qwen-image-2.1--stable-diffusion-cpp-vulkan-radv-strix-apu-v2
status: WORKING
derived:
  engine: stable-diffusion-cpp-vulkan-radv-v1
  model: Qwen-Image-2.1 (7B DiT, unified gen+edit, Qwen3-VL 8B text encoder)
  params: 7B
  active_params: null
  quant: Q8_0
  mtp: false
  dflash: false
  target_gpu: strix-apu
  notes: >-
    M-149 tuning pass (2026-09-21). Identical to v1 except one flag:
    --cache-mode easycache (DiT step-skipping cache, one of the options
    sd-server exposes with no LLM-decode equivalent - see v1's own notes).
    Kept on a separate port (8201) from v1 (8200) deliberately, matching
    this catalog's own precedent (Ornith v7 vs v8/v9) for a genuine
    side-by-side comparison rather than reusing one port across
    iterations - avoids GPU-residency contention biasing either
    measurement by running one at a time, not simultaneously.

    Purpose: isolate whether easycache's step-skipping meaningfully cuts
    the ~12.7s/step marginal cost v1 measured, independent of quant
    choice (that's a separate axis, see the -q5_0/-q4_k sibling builds).

    RESULT (real bench-images.sh run, tested standalone with v1 stopped
    to avoid GPU contention): 4 steps=63.9s (v1: 59.6s, within noise -
    easycache needs a few steps of history before it can start skipping
    recompute, so no benefit shows up yet this early), 20 steps=135.5s
    (v1: 263.8s) - a real ~49% reduction at 20 steps, the step count
    that matters since litellm's route can't override it anyway (see
    v1's notes). Single biggest lever found so far - bigger than any
    quant change is likely to be on its own. Real candidate for v3:
    Q8_0 + easycache is already a clear win over v1; worth also testing
    a lower quant + easycache combined once the standalone quant
    results are in, to see if the two stack.
