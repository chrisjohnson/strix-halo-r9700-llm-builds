# v1 of qwen3.8-27b-turbo-brilliance-neo-max-mtp-q6k on the R9700 eGPU (Vulkan0): a mirror
# of dirk-qwen3.8-27b-q6kxl--llamacpp-vulkan-radv-r9700-mtp-v11 (the build currently
# running) for DavidAU's Qwen3.8-27B Turbo Brilliance 50X Reasoning Instruct, NEO MAX
# imatrix quant with MTP layers (Q6_K, 24.03 GB vs Dirk's 25.3 GB UD-Q6_K_XL). Same image,
# same llama-server flags, same GPU - only the GGUF, the mmproj, the served alias and the
# port differ. See build.yaml for the full reasoning, what is and is not validated, and
# the follow-ups (download status, MTP check, Prometheus target, litellm).
#
# Flags carried over from dirk v11 unchanged: --spec-type draft-mtp --spec-draft-n-max 4
# --spec-draft-p-min 0.6, -np 1, -c 262144, -n 16384, -ctk q4_0 -ctv q4_0, and
# --cache-ram 8192 (llama.cpp's HOST-RAM prompt cache; 8 GiB fits inside this box's real
# memory headroom - dirk v11 documents the OOM-kill history and the ~114,700-token
# arithmetic, which should hold for the same Qwen3.8-27B base geometry).
#
# PORT: 8214 (8100-8199 exhausted, 8206-8213 taken). Not dirk's 8161, so the compose files
# coexist, but the two builds cannot RUN together: same R9700, two 262k-context 27B
# instances would oversubscribe its 32 GiB.
#
# Vulkan0 = R9700 eGPU (32 GiB GDDR6), Vulkan1 = Strix Halo APU.
# No `com.local-ai-machine.always-up` label: not part of the standing set.
name: docker
services:
  qwen3.8-27b-turbo-brilliance-neo-max-mtp-q6k--llamacpp-vulkan-radv-r9700-mtp-v1:
    image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
    container_name: qwen3.8-27b-turbo-brilliance-neo-max-mtp-q6k--llamacpp-vulkan-radv-r9700-mtp-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - "26"
    - "303"
    volumes:
    - /var/lib/ai-models/qwen3.8-27b-turbo-brilliance-neo-max-mtp-q6k:/models:ro
    - /var/lib/ai-models/qwen3.8-27b-turbo-brilliance-mmproj:/mmproj:ro
    command: "llama-server -m /models/Qwen3.8-27B-Turbo-Brilliance-50X-RI-NEO-MAX-MTP-Q6_K.gguf -dev Vulkan0
      -ngl 999 -fa 1 --spec-type draft-mtp --spec-draft-n-max 4 --spec-draft-p-min
      0.6 -np 1 -c 262144 -n 16384 -ctk q4_0 -ctv q4_0 --cache-ram 8192
      --mmproj /mmproj/mmproj-F16.gguf --mmproj-device Vulkan0
      --host 0.0.0.0
      --port 8080 -a qwen3.8-27b-turbo-brilliance-r9700-mtp --metrics

      "
    ports:
    - 127.0.0.1:8214:8080
