name: docker
services:
  deepseek-v4-flash-dspark-q5--lucebox-dflash-rocm722-dualgpu-r9700-strix-v1:
    image: strix-halo-r9700-llm-builds/lucebox-dflash-ds4-dualgpu:rocm-7.2.2
    container_name: deepseek-v4-flash-dspark-q5--lucebox-dflash-rocm722-dualgpu-r9700-strix-v1
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - '26'
    - '303'
    mem_limit: 115g
    volumes:
    - /var/lib/ai-models/lucebox-ds4-flash-rocmfp3:/models/target:ro
    - /var/lib/ai-models/lucebox-ds4-flash-dspark-gguf:/models/draft:ro
    # M-137: full qualified tuning manifest (matches
    # harness/qualification/deepseek4/qualify_ds4_q5_amd.sh's env vars,
    # minus the sudo-gated rocm-smi --setperflevel step, which is a host-
    # level action outside this container's scope - see
    # local-ai-machine's own passwordless-sudo rule for that, applied
    # separately if desired). HIP_VISIBLE_DEVICES=1,0 (not 0,1) is
    # deliberate and container-specific: KFD topology inverts HIP device
    # order inside Docker regardless of --device bind-mount order, unlike
    # bare metal - confirmed in
    # https://github.com/Luce-Org/lucebox/issues/681's own body.
    environment:
      HIP_VISIBLE_DEVICES: "1,0"
      DFLASH_DS4_SPEC: "1"
      DFLASH_DS4_SPEC_Q: "5"
      DFLASH_DS4_DRAFT: /models/draft/DeepSeek-V4-Flash-DSpark-draft-Q4RMFP4-denseF16.gguf
      DFLASH_DS4_DRAFT_GPU: "0"
      DFLASH_DS4_DRAFT_CONTEXT_KV_CACHE: "1"
      DFLASH_DS4_Q5_VERIFY: "1"
      DFLASH_DS4_TOPK: "4"
      DFLASH_DS4_ADAPTIVE_WIDTH: "0"
      DFLASH_DS4_FUSED_VERIFY: "1"
      DFLASH_DS4_FUSED_HYBRID_DECODE: "1"
      DFLASH_DS4_TIMING: "1"
      DFLASH_DS4_MOE_TP: "1"
      DFLASH_DS4_MOE_TP_INPROC: "1"
      DFLASH_DS4_MOE_TP_GPU: "1"
      # DFLASH_DS4_HOTNESS_CSV intentionally omitted: DFLASH_DS4_TP_CRITICAL_PATH_PLACEMENT
      # requires it to point at a pre-captured per-layer routing profile
      # (see server/docs/DS4.md), which only ever existed inside the
      # earlier ad hoc test container's /tmp and was never persisted to
      # the host - it's gone. Re-enable both once a fresh capture run
      # (see DS4.md's capture flow) produces a new CSV somewhere durable
      # (e.g. bind-mounted, not container-internal /tmp).
      DFLASH_DS4_TP_CAPTURE_CACHE_SLOTS: "4"
      DFLASH_DS4_TP_MASKED_ROUTES: "1"
      DFLASH_DS4_TP_GROUPED_MMVQ: "1"
      DFLASH_DS4_TP_SPLIT_COUNT: "1"
      DFLASH_DS4_TP_ROUTE_PREFORK: "1"
      DFLASH_DS4_TP_DEVICE_JOIN: "1"
      DFLASH_DS4_TP_DEVICE_JOIN_SPLIT: "1"
      DFLASH_DS4_TP_FUSED_HC_JOIN: "1"
      DFLASH_DS4_TP_MAIN_ROUTE_WEIGHTS: "1"
      DFLASH_DS4_TP_COARSE_OWNER: "1"
      DFLASH_DS4_TP_COARSE_OWNER_SPLIT: "0"
      DFLASH_DS4_TP_NATIVE_ROUTE_WIDTH: "1"
      DFLASH_DS4_TP_CRITICAL_PATH_PLACEMENT: "0"
      DFLASH_DS4_TP_MAIN_TO_PEER_RATE: "4.4"
      DFLASH_DS4_TP_BALANCE_MIN_HOT: "0"
      DFLASH_DS4_HYBRID_PREFILL_GPU_HC: "1"
      DFLASH_DS4_HYBRID_PREFILL_EAGER: "1"
      DFLASH_DS4_PREFILL_TRACE: "0"
      DFLASH_DS4_PINNED_ROLLBACK: "1"
      DFLASH_DS4_GPU_ARGMAX_VERIFY: "1"
      DFLASH_EXPERT_BUDGET_MB: "14350"
      DFLASH_MMID_GROUPED: "1"
      DFLASH_MMID_GROUPED_DEVICE: "1"
      DFLASH_MMID_GROUPED_TYPES: "8"
      DFLASH_MOE_DUPLICATE_HOT_ON_COLD: "1"
      DFLASH_MOE_FULL_COLD_PARALLEL: "1"
      DFLASH_MOE_FUSED_COMBINE: "0"
      DFLASH_MOE_PREFILL_PERSISTENT_OWNER_ALLOC: "1"
      DFLASH_ROCMFP2_FIXED_K: "1"
      DFLASH_ROCMFP3_FIXED_K: "1"
      DFLASH_ROCMFP4_UNROLL2: "1"
      DFLASH_CUDA_MMVQ_FP4_X4: "1"
      DFLASH_CUDA_MMVQ_MOE_FP2_PACKED32: "0"
      DFLASH_CUDA_MMVQ_MOE_FP3_PACKED24: "1"
      DFLASH_CUDA_MMVQ_MOE_ROWS_PER_BLOCK: "2"
      GGML_CUDA_BATCH_PEER_COPIES: "1"
      GGML_CUDA_GRAPH_STATS: "1"
      GGML_CUDA_GRAPH_STATS_EVERY: "200"
      LUCE_CUDA_I32_REPEAT: "1"
    command: './dflash_server /models/target/DeepSeek-V4-Flash-ROCMFP2-STRIX.gguf --host
      0.0.0.0 --port 8080 --max-ctx 18432 --target-device hip:0 --prefix-cache-slots
      0 --prefill-cache-slots 0 --hard-limit-reply-budget 0 --chunk 2048 --ds4-fused-decode
      --ds4-expert-top-k 4 --ds4-prefill sparse --peer-access

      '
    ports:
    - 127.0.0.1:8150:8080
